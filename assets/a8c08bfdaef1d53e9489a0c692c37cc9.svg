  <rect x="268" y="28" width="80" height="18" rx="3" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
  <text x="308.0" y="40.5" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="bold" fill="#EF4444" text-anchor="middle">Radicals</text>
  <line x1="272" y1="46" x2="344" y2="46" stroke="#EF4444" stroke-width="2"/>
  <rect x="352" y="28" width="74" height="18" rx="3" fill="#111A2E" stroke="#1E293B" stroke-width="1"/>
  <text x="389.0" y="40.5" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="normal" fill="#64748B" text-anchor="middle">Ions</text>

  <!-- Bottom Action Bar -->
  <rect x="0" y="222" width="440" height="28" rx="8" fill="#1E293B"/>
  <line x1="0" y1="222" x2="440" y2="222" stroke="#334155" stroke-width="1"/>
  
  <!-- Reset Button [D] -->
  <rect x="14" y="226" width="110" height="20" rx="3" fill="#2A171D" stroke="#EF4444" stroke-width="1"/>
  <text x="69" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="bold" fill="#F87171" text-anchor="middle">Reset Archive [D]</text>
  
