    <text x="271" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Hydroxyl Radic</text>
    <text x="271" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="6.5" fill="#94A3B8" text-anchor="middle">H2O + hν → •OH</text>
