  <rect x="96" y="28" width="78" height="18" rx="3" fill="#111A2E" stroke="#1E293B" stroke-width="1"/>
  <text x="135.0" y="40.5" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="normal" fill="#64748B" text-anchor="middle">Elements</text>
  <rect x="178" y="28" width="86" height="18" rx="3" fill="#111A2E" stroke="#1E293B" stroke-width="1"/>
