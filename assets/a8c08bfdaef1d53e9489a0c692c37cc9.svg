  <rect x="348" y="54" width="70" height="14" rx="2" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
  <text x="383" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="6.5" font-weight="bold" fill="#94A3B8" text-anchor="middle">UV ACTIVE</text>
